<!doctype html>
<!-- Déclaration du type du document -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Lien vers la feuille de style CSS de la page -->
    <link rel="stylesheet" href="memory.css" />
    <title>Mon profil</title>
  </head>
  <body>
    <h1>ENI - Memory</h1>
    <!-- Menu de navigation principal -->
    <nav class="menu">
      <ul>
        <li><a href="accueil.html">Accueil</a></li>
        <li><a href="play.html">Jouer</a></li>
        <li><a href="inscription.html">S'inscrire</a></li>
        <li><a href="signin.html">Se connecter</a></li>
        <li><a href="profile.html">Profil</a></li>
      </ul>
    </nav>
    <br />
    <fieldset>
      <h2>Profil</h2>
      <div class="userProfile">
        <!-- Avatar de l'utilisateur (taille définie dans memory.css) -->
        <img
          src="ressources/question.svg"
          alt="Avatar de l'utilisateur"
          class="profileImage"
        />
        <!-- Formulaire non branché : pas encore de sauvegarde (voir roadmap) -->
        <form action="profile.html" id="formProfile" method="post">
          <!-- Nom et adresse mail de l'utilisateur -->
          <div class="field">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" id="username" name="userName" />
          </div>

          <div class="field">
            <label for="email">Adresse mail</label>
            <input type="email" id="email" name="userMail" />
          </div>

          <!-- Le "for" correspond à l'id du select : cliquer sur le texte l'active -->
          <div class="field">
            <label for="memorySelect">Choix du Memory</label>
            <!-- Liste déroulante pour choisir le thème du Memory -->
            <select name="tiles" id="memorySelect">
              <option value="">Veuillez sélectionner une option</option>
              <option value="animatedPets">Animaux animés</option>
              <option value="vegetables">Fruits et légumes</option>
              <option value="animals">Animaux</option>
              <option value="dinosaurs">Dinosaures</option>
            </select>
          </div>

          <!-- Liste déroulante pour choisir la taille du plateau -->
          <div class="field">
            <label for="sizeSelection">Taille du Memory</label>
            <select name="size" id="sizeSelection">
              <option value="4x3">4 * 3</option>
              <option value="4x4">4 * 4</option>
              <option value="6x3">6 * 3</option>
            </select>
          </div>

          <!-- Bouton d'enregistrement -->
          <button type="submit">Enregistrez les modifications</button>
        </form>
      </div>
    </fieldset>
  </body>
</html>
