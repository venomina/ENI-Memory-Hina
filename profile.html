<!doctype html>
<!-- Déclaration du type du document-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Lien vers la feuille de style CSS de la page -->
    <link rel="stylesheet" href="memory.css" />
    <title>Mon profil</title>
  </head>
  <body>
    <h1>ENI - Memory</h1>
    <!-- Affichage barre du menu -->
    <nav class="Menu">
      <ul>
        <li><a href="accueil.html">Accueil</a></li>
        <li><a href="play.html">Jouer</a></li>
        <li><a href="inscription.html">S'inscrire</a></li>
        <li><a href="signin.html">Se connecter</a></li>
        <li><a href="profile.html">Profil</a></li>
      </ul>
    </nav>
    <br />
    <fieldset>
      <h2>Profil</h2>
      <div class="userProfile">
        <!-- Avatar de l'utilisateur (taille fixée en ligne par le style) -->
        <img
          src="ressources\question.svg"
          alt="Point d'interrogation bleu"
          class="profileImage"
          style="height: 5%; width: 5%"
        />
        <!-- Nom et adresse mail de l'utilisateur -->
        <p class="profileName">Nom d'utilisateur :</p>
        <p class="profileMail">Adresse mail :</p>
        <p class=""></p>
        <br />

        <!-- Le "for" correspond à l'id du select : cliquer sur le texte l'active -->
        <label for="memory-select">Choix du memory :</label>
        <!-- Liste déroulante pour choisir le thème du memory -->
        <select name="tiles" id="memory-select">
          <option value="">Veuillez sélectionner une option</option>
          <option value="animatedPets">Animaux animés</option>
          <option value="vegetables">Fruits et légumes</option>
          <option value="animals">Animaux</option>
          <option value="pets">Dinosaures</option>
        </select>
        <br />
        <br />
        <!-- Bouton d'enregistrement -->
        <button type="submit">Enregistrez les modifications</button>
      </div>
    </fieldset>
  </body>
</html>
