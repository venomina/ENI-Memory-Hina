<!doctype html>
<!-- Déclaration du type du document -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S'inscrire</title>
    <!-- Lien vers la feuille de style CSS de la page -->
    <link rel="stylesheet" href="memory.css" />
  </head>
  <body>
    <h1>ENI - Memory</h1>
    <!-- Menu de navigation principal -->
    <nav class="Menu">
      <ul>
        <li><a href="accueil.html">Accueil</a></li>
        <li><a href="play.html">Jouer</a></li>
        <li><a href="inscription.html">S'inscrire</a></li>
        <li><a href="signin.html">Se connecter</a></li>
        <li><a href="profile.html">Profil</a></li>
      </ul>
    </nav>
    <br />

    <!-- Bloc contenant le formulaire d'inscription -->
    <fieldset>
      <h2>Inscrivez-vous !</h2>
      <form
        action="/memory.html"
        id="form-inscription"
        method="post"
        novalidate
      >
        <ul>
          <!-- Champ nom d'utilisateur : autofocus place le curseur ici au chargement -->
          <li class="group">
            <label for="name">Nom d'utilisateur</label>
            <br />
            <input
              type="text"
              id="name"
              name="user_name"
              autofocus
              required
              autocomplete="username"
              aria-describedby="error-name"
              placeholder="exemple : JaneD"
            />
            <img
              class="isOkay"
              src="/ressources/check.svg"
              alt="Saisie validée."
            />
            <img
              class="notOkay"
              src="/ressources/error.svg"
              alt="Saisie invalide."
            />
            <div>
              <p class="error" id="error-name" aria-live="polite"></p>
            </div>
          </li>
          <!-- Champ email : le type "email" vérifie le format de l'adresse -->
          <li class="group">
            <label for="mail">Entrez votre email</label>
            <br />
            <input
              type="email"
              id="mail"
              name="user_mail"
              placeholder="exemple : janedoe@mail.com"
              required
              autocomplete="email"
              aria-describedby="error-mail"
            />
            <img
              class="isOkay"
              src="/ressources/check.svg"
              alt="Saisie validée."
            />
            <img
              class="notOkay"
              src="/ressources/error.svg"
              alt="Saisie invalide."
            />
            <div>
              <p class="error" id="error-mail" aria-live="polite"></p>
            </div>
          </li>
          <!-- Champ mot de passe : le pattern vérifie les règles de saisie -->
          <li class="group">
            <label for="password">Mot de passe</label>
            <br />
            <input
              type="password"
              id="password"
              name="user_password"
              required
              autocomplete="new-password"
              aria-describedby="error-password"
            />
            <img
              class="isOkay"
              src="/ressources/check.svg"
              alt="Saisie validée."
            />
            <img
              class="notOkay"
              src="/ressources/error.svg"
              alt="Saisie invalide."
            />
            <div>
              <p class="error" id="error-password" aria-live="polite"></p>
            </div>
            <!-- Rappel des règles du mot de passe -->
            <p class="passRule" id="passRule">
              Minimum 6 caractères, 1 chiffre, 1 lettre, 1 symbole
            </p>
          </li>
          <br />
          <!-- Confirmation du mot de passe par l'utilisateur-->
          <li class="group">
            <label for="password-confirm">Confirmer le mot de passe</label>
            <br />
            <input
              type="password"
              id="password-confirm"
              name="user-password-confirm"
              required
              autocomplete="new-password"
              aria-describedby="error-password-confirm"
            />
            <img
              class="isOkay"
              src="/ressources/check.svg"
              alt="Saisie validée."
            />
            <img
              class="notOkay"
              src="/ressources/error.svg"
              alt="Saisie invalide."
            />
            <div>
              <p
                class="error"
                id="error-password-confirm"
                aria-live="polite"
              ></p>
            </div>
          </li>
        </ul>
        <!-- Boutons : créer le compte ou réinitialiser le formulaire -->
        <div class="button">
          <button type="submit" id="btnOkay">Création du compte</button>
          <button type="reset">Annuler</button>
        </div>
      </form>
    </fieldset>
  </body>
</html>
