<!doctype html>
<!-- Déclaration du type du document -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S'inscrire</title>
    <!-- Lien vers la feuille de style CSS de la page -->
    <link rel="stylesheet" href="memory.css" />
  </head>
  <body>
    <h1>ENI - Memory</h1>
    <!-- Menu de navigation principal -->
    <nav class="menu">
      <ul>
        <li><a href="accueil.html">Accueil</a></li>
        <li><a href="play.html">Jouer</a></li>
        <li><a href="inscription.html">S'inscrire</a></li>
        <li><a href="signin.html">Se connecter</a></li>
        <li><a href="profile.html">Profil</a></li>
      </ul>
    </nav>
    <br />

    <!-- Bloc contenant le formulaire d'inscription -->
    <fieldset>
      <h2>Inscrivez-vous !</h2>
      <form action="accueil.html" id="formInscription" method="post" novalidate>
        <ul>
          <!-- Champ nom d'utilisateur : autofocus place le curseur ici au chargement -->
          <li class="group">
            <label for="name">Nom d'utilisateur</label>
            <br />
            <input
              type="text"
              id="name"
              name="userName"
              autofocus
              required
              autocomplete="username"
              aria-describedby="errorName"
              placeholder="exemple : JaneD"
            />
            <!-- Icônes de validation : affichées selon la classe du groupe
                 (valide ou invalide) -->
            <img
              class="isOkay"
              src="ressources/check.svg"
              alt="Saisie validée."
            />
            <img
              class="notOkay"
              src="ressources/error.svg"
              alt="Saisie invalide."
            />
            <div>
              <p class="error" id="errorName" aria-live="polite"></p>
            </div>
          </li>
          <!-- Champ email (novalidate désactive le contrôle du navigateur : le format
               sera vérifié par inscription.js, à venir) -->
          <li class="group">
            <label for="mail">Entrez votre email</label>
            <br />
            <input
              type="email"
              id="mail"
              name="userMail"
              placeholder="exemple : janedoe@mail.com"
              required
              autocomplete="email"
              aria-describedby="errorMail"
            />
            <img
              class="isOkay"
              src="ressources/check.svg"
              alt="Saisie validée."
            />
            <img
              class="notOkay"
              src="ressources/error.svg"
              alt="Saisie invalide."
            />
            <div>
              <p class="error" id="errorMail" aria-live="polite"></p>
            </div>
          </li>
          <!-- Champ mot de passe : sa force est estimée par inscription.js -->
          <li class="group">
            <label for="password">Mot de passe</label>
            <br />
            <input
              type="password"
              id="password"
              name="userPassword"
              required
              placeholder="Votre mot de passe"
              autocomplete="new-password"
              aria-describedby="errorPassword"
            />
            <img
              class="isOkay"
              src="ressources/check.svg"
              alt="Saisie validée."
            />
            <img
              class="notOkay"
              src="ressources/error.svg"
              alt="Saisie invalide."
            />
            <!-- Rappel des règles du mot de passe -->
            <p class="passRule" id="passRule">
              Au moins un symbole, un chiffre, ainsi que 6 caractères minimum.
            </p>
            <!-- Indicateur de force : inscription.js modifie data-level
                 (faible, moyen, fort), le CSS en déduit couleur et longueur -->
            <div class="passStrength" id="passStrength" data-level="">
              <div class="strengthBar"><span></span></div>
              <p class="strengthText" id="strengthText" aria-live="polite"></p>
            </div>
            <div>
              <p class="error" id="errorPassword" aria-live="polite"></p>
            </div>
          </li>
          <!-- Confirmation du mot de passe par l'utilisateur-->
          <li class="group">
            <label for="passwordConfirm">Confirmer le mot de passe</label>
            <br />
            <input
              type="password"
              id="passwordConfirm"
              name="userPasswordConfirm"
              required
              placeholder="Confirmez le mot de passe"
              autocomplete="new-password"
              aria-describedby="errorPasswordConfirm"
            />
            <img
              class="isOkay"
              src="ressources/check.svg"
              alt="Saisie validée."
            />
            <img
              class="notOkay"
              src="ressources/error.svg"
              alt="Saisie invalide."
            />
            <div>
              <p class="error" id="errorPasswordConfirm" aria-live="polite"></p>
            </div>
          </li>
        </ul>
        <!-- Boutons : créer le compte ou réinitialiser le formulaire -->
        <div class="button">
          <button type="submit" id="btnOkay">Création du compte</button>
          <button type="reset">Annuler</button>
        </div>
      </form>
    </fieldset>
    <!-- Script JS de l'inscription (indicateur de force du mot de passe) -->
    <script src="inscription.js" defer></script>
  </body>
</html>
