<!doctype html>
<!-- Déclaration du type du document -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Lien vers la feuille de style CSS de la page -->
    <link rel="stylesheet" href="memory.css" />
    <title>Jouer au Memory de l'ENI !</title>
  </head>
  <body>
    <h1>ENI - Memory</h1>
    <!-- Menu de navigation principal -->
    <nav class="menu">
      <ul>
        <li><a href="accueil.html">Accueil</a></li>
        <li><a href="play.html">Jouer</a></li>
        <li><a href="inscription.html">S'inscrire</a></li>
        <li><a href="signin.html">Se connecter</a></li>
        <li><a href="profile.html">Profil</a></li>
      </ul>
    </nav>
    <br />

    <!-- Bloc contenant le jeu -->
    <fieldset class="memoryGame">
      <!-- Consignes du jeu -->
      <p class="gameOn">Tentez de gagner avec le moins d'essais possible !</p>
      <p class="gameOn">
        Appuyez sur la <strong><u>barre espace</u></strong> pour relancer le jeu
        une fois la partie terminée.
      </p>
      <br />
      <!-- Message de victoire (rempli par memory.js) -->
      <p class="finalMessage" aria-live="polite"></p>
      <!-- Compteur de coups (mis à jour par memory.js) -->
      <p class="nbAttempts" aria-live="polite">Nombre de coups : 0</p>

      <!-- Plateau de jeu : 12 tuiles réparties sur 3 lignes de 4 colonnes.
           Chaque tuile est un <button> (utilisable au clavier) placé dans une
           case <td>. memory.js lit les <td> dans l'ordre (index 0 à 11) et
           donne à chaque bouton un aria-label (l'image a un alt vide). Les id
           tile0 à tile11 ne sont pas utilisés par le script.
           Toutes affichent le dos de tuile au départ. -->
      <table>
        <!-- Ligne 1 : tuiles 0 à 3 -->
        <tr>
          <td>
            <button type="button" id="tile0">
              <img src="ressources/question_bleus_pastel.svg" alt="" />
            </button>
          </td>
          <td>
            <button type="button" id="tile1">
              <img src="ressources/question_bleus_pastel.svg" alt="" />
            </button>
          </td>
          <td>
            <button type="button" id="tile2">
              <img src="ressources/question_bleus_pastel.svg" alt="" />
            </button>
          </td>
          <td>
            <button type="button" id="tile3">
              <img src="ressources/question_bleus_pastel.svg" alt="" />
            </button>
          </td>
        </tr>
        <!-- Ligne 2 : tuiles 4 à 7 -->
        <tr>
          <td>
            <button type="button" id="tile4">
              <img src="ressources/question_bleus_pastel.svg" alt="" />
            </button>
          </td>
          <td>
            <button type="button" id="tile5">
              <img src="ressources/question_bleus_pastel.svg" alt="" />
            </button>
          </td>
          <td>
            <button type="button" id="tile6">
              <img src="ressources/question_bleus_pastel.svg" alt="" />
            </button>
          </td>
          <td>
            <button type="button" id="tile7">
              <img src="ressources/question_bleus_pastel.svg" alt="" />
            </button>
          </td>
        </tr>
        <!-- Ligne 3 : tuiles 8 à 11 -->
        <tr>
          <td>
            <button type="button" id="tile8">
              <img src="ressources/question_bleus_pastel.svg" alt="" />
            </button>
          </td>
          <td>
            <button type="button" id="tile9">
              <img src="ressources/question_bleus_pastel.svg" alt="" />
            </button>
          </td>
          <td>
            <button type="button" id="tile10">
              <img src="ressources/question_bleus_pastel.svg" alt="" />
            </button>
          </td>
          <td>
            <button type="button" id="tile11">
              <img src="ressources/question_bleus_pastel.svg" alt="" />
            </button>
          </td>
        </tr>
      </table>
    </fieldset>

    <!-- Script JS du jeu -->
    <script src="memory.js"></script>
  </body>
</html>
