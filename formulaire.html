            </li>

    <h2>Inscrivez-vous !</h2>
    <form action="/memory.html" method="post">
      <ul>
        <li>
          <label for="name">Nom d'utilisateur</label>
          <input
            type="text"
            id="nom"
            name="user_name"
            autofocus
            required
            placeholder="Nom de famille"
            pattern="[A-Za-z]{3}"
            title="Saisissez votre nom de famille (Minimum de 3 caractères.)"
          />
        </li>
          <li>
          <label for="email">Entrez votre email</label>
          <input
            type="email"
            id="mail"
            name="user_mail"
            placeholder="janedoe@mail.com"
            title="Saisissez votre adresse email."
          />
        </li>
        <li>
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            name="user_password"
            pattern="(?=.*\d)(?=.*[A-Z])(?=.*[a-z]).{8,}"
            title="Saisissez un mot de passe comprenant : minimum 8 caractères, des lettres majuscules et des lettres minuscules, et des chifffres"
          />
        </li>
        <li>
          <label for="password">Confirmer le mot de passe</label>
          <input
            type="password"
            id="password"
            name="user_password"
            pattern="(?=.*\d)(?=.*[A-Z])(?=.*[a-z]).{8,}"
            title="Saisissez un mot de passe comprenant : minimum 8 caractères, des lettres majuscules et des lettres minuscules, et des chifffres"
          />
        </li>
      </ul>
      <div class="button">
        <button type="submit">Création du compte</button>
        <button type="submit">Annuler</button>
      </div>
    </form>
</body>
</html>
